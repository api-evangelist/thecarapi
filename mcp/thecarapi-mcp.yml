search_note: >-
  No MCP server is published by TheCarApi — hosted or local. /.well-known/mcp.json returns 404 on
  both thecarapi.com and api.thecarapi.com; there is no npm or PyPI package under this name; there
  is no provider GitHub organisation; and the provider's own agent guidance page
  (https://thecarapi.com/docs/agents) points agents at the OpenAPI document, the Markdown twins
  and llms.txt rather than at any MCP endpoint. The tool list below is a CANDIDATE derived from
  the published OpenAPI operations — it describes what an MCP server over this API could expose,
  not anything the provider ships. No MCPServer pointer is wired in apis.yml, because wiring one
  would assert an agent surface that does not exist.
