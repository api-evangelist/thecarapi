privacy:
  privacy_policy: https://thecarapi.com/privacy
  terms_of_service: https://thecarapi.com/terms
  data_minimisation_claim: >-
    The 2026-08-14 changelog entry records that account-scoped commercial data is stripped at the
    response boundary — auction fees, bid history, transport and delivery keys, the provider's own
    buyer-account identity, and internal processing metadata — and that email addresses are
    redacted from free-text values. That is a published data-handling behaviour, not a
    certification.
