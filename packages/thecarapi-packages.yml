      returns 404), no buf.build module, and the docs describe one REST/JSON transport only.
  wsdl_soap:
    published: false
    probes:
      - url: https://api.thecarapi.com/?wsdl
        status: 401
        note: >-
          Not a SOAP endpoint. The API host answers every unauthenticated path with
          {"error":"Invalid or missing API key","success":false}; the 401 is the auth gate, not a
