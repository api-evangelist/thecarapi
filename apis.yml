- aid: thecarapi:thecarapi-market-intelligence-api
  name: TheCarApi Market intelligence API
  description: >-
    Precomputed price snapshots for a brand, model, and year window — one for the Bulgarian retail market,
    one for our own auction inventory. Scope: market. Neither is enabled on a new key by default; ask
    for them. Both are read-only lookups into snapshots built by a pipeline on its own schedule. A 404
    therefore means "no snapshot exists for that window", which is the normal answer for a thin brand/model/year
    combination — not an error to retry. Neither route carries envelope metadata; read X-Request-ID from
    the header.
  humanURL: https://thecarapi.com/docs
  baseURL: https://api.thecarapi.com
  tags:
  - Market intelligence
