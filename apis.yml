- aid: thecarapi:thecarapi-european-classifieds-api
  name: TheCarApi European classifieds API
  description: >-
    A retail price surface of roughly 9.8M live listings gathered from 681 origin portals — national classifieds
    sites, dealer groups and manufacturer stock pages — across 39 European countries: mobile.de, kleinanzeigen.de,
    autoscout24, leboncoin.fr, lacentrale.fr, autosupermarket.it, njuskalo.hr and hundreds more. Every
    listing keeps its origin portal in source_site, so the same feed answers a national question and a
    portal-level one. These are retail listings, not auction inventory: no bidding, no auction end date,
    no detail payload and no gallery, just a single remote thumbnail per listing. They live in their own
    tables with their own vocabulary (seller type, origin portal), which is why they get their own query
    surface instead of a site slug on /api/search. Ended and paid-placement ("promoted") rows are excluded
    from every response, and all three endpoints return 503 while the dataset has not been built yet.
    Scope: theparking — that is the scope name in the path, not the name of a source.
  humanURL: https://thecarapi.com/docs
  baseURL: https://api.thecarapi.com
  tags:
  - European classifieds
  properties:
  - type: OpenAPI
    url: openapi/thecarapi-european-classifieds-api-openapi.yml
  - type: PostmanCollection
    url: https://thecarapi.com/thecarapi.postman_collection.json
  - type: Documentation
    url: https://thecarapi.com/docs
  - type: LLMsTxt
    url: https://thecarapi.com/llms.txt
- aid: thecarapi:thecarapi-filter-facets-api
  name: TheCarApi Filter facets API
  description: >-
    Discover live filter values and counts. Every facet endpoint accepts the search filters, so a facet
    describes whatever slice of inventory you are looking at rather than the whole of it — each dimension
    ignoring only its own filter, so a user can switch brands without the option disappearing. Counts
    and the totals /api/search reports for the same filters cannot disagree. Facet responses cache for
    about 600 seconds, and a filter sidebar can read every flat dimension in one call with /api/facets.
  humanURL: https://thecarapi.com/docs
  baseURL: https://api.thecarapi.com
  tags:
  - Filter facets
